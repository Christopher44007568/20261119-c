<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉丝金属 · 各向异性高光</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #cfd3da;
    font: 13px/1.5 system-ui, sans-serif; overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 260px; padding: 12px 14px;
    background: rgba(20, 22, 26, .88); border: 1px solid #2c313a; border-radius: 8px; }
  #panel h1 { font-size: 14px; margin: 0 0 8px; color: #e8ebf0; }
  .row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px;
    align-items: center; margin: 6px 0; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; color: #9aa3b0; }
  input[type=range] { width: 100%; accent-color: #6aa9ff; }
  .hint { margin-top: 8px; color: #7c8593; font-size: 12px; }
  label.check { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="panel">
  <h1>拉丝金属 · 各向异性 GGX</h1>
  <div class="row"><span>光源方位角</span><input id="lightAz" type="range" min="0" max="360" value="40"><output></output></div>
  <div class="row"><span>光源仰角</span><input id="lightEl" type="range" min="5" max="85" value="55"><output></output></div>
  <div class="row"><span>切线旋转</span><input id="tangentRot" type="range" min="0" max="180" value="0"><output></output></div>
  <div class="row"><span>粗糙度 X</span><input id="roughX" type="range" min="0.05" max="1" step="0.01" value="0.55"><output></output></div>
  <div class="row"><span>粗糙度 Y</span><input id="roughY" type="range" min="0.05" max="1" step="0.01" value="0.18"><output></output></div>
  <label class="check"><input id="spin" type="checkbox"> 自动旋转光源</label>
  <div class="hint">X 沿切线方向，Y 沿副切线方向；高光沿较粗糙的轴拉伸。两粗糙度相等时退化为各向同性。</div>
</div>
<script type="module" src="demo.js"></script>
</body>
</html>
