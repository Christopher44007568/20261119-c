<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>透视正确纹理插值实验台</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1d222b;
    --panel2: #232a36;
    --fg: #dfe6ef;
    --dim: #8b96a5;
    --accent: #4da3ff;
    --warn: #ff7a59;
    --ok: #5fd68a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 "SF Mono", "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
  }
  header { padding: 14px 20px 6px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--dim); font-size: 12px; }
  .layout { display: flex; gap: 16px; padding: 12px 20px 20px; flex-wrap: wrap; }
  .views { display: flex; gap: 16px; flex-wrap: wrap; }
  .view { background: var(--panel); border-radius: 8px; padding: 10px; }
  .view h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  .view h2 .tag { color: var(--dim); font-weight: 400; }
  canvas { display: block; border-radius: 4px; cursor: crosshair; background: #0c0e12; }
  .side { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--panel); border-radius: 8px; padding: 12px 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .row label { width: 110px; color: var(--dim); flex: none; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .val { width: 52px; text-align: right; }
  .seg { display: flex; gap: 6px; }
  .seg button, .btn {
    background: var(--panel2); color: var(--fg); border: 1px solid #333c4a;
    border-radius: 5px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .seg button.active { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 700; }
  .btn:hover, .seg button:hover { filter: brightness(1.15); }
  table.probe { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.probe td { padding: 3px 6px; border-bottom: 1px solid #2a323f; }
  table.probe td.k { color: var(--dim); white-space: nowrap; }
  table.probe td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .err-bad { color: var(--warn); font-weight: 700; }
  .err-good { color: var(--ok); font-weight: 700; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>透视正确纹理插值实验台</h1>
  <p>拖动角点改变形状，滑杆/滚轮调整角点深度 w；切换对角线观察：透视校正（1/w）结果不变，仿射插值暴露三角化差异。</p>
</header>
<div class="layout">
  <div class="views">
    <div class="view">
      <h2>仿射插值 <span class="tag">u,v 直接按屏幕重心坐标线性插值</span></h2>
      <canvas id="cvAffine" width="440" height="440"></canvas>
    </div>
    <div class="view">
      <h2>透视校正 <span class="tag">插值 u/w, v/w, 1/w 后相除</span></h2>
      <canvas id="cvPersp" width="440" height="440"></canvas>
    </div>
  </div>
  <div class="side">
    <div class="panel">
      <h3>三角化对角线</h3>
      <div class="seg" id="diagSeg">
        <button data-diag="A" class="active">对角线 A：v0–v2</button>
        <button data-diag="B">对角线 B：v1–v3</button>
      </div>
      <div class="row hint" id="diagNote"></div>
    </div>
    <div class="panel">
      <h3>角点深度 w（= 视空间 z）</h3>
      <div id="depthSliders"></div>
      <div class="row">
        <button class="btn" id="btnTilt">倾斜矩形</button>
        <button class="btn" id="btnFlat">正面矩形</button>
        <button class="btn" id="btnWarped">扭曲四边形</button>
        <button class="btn" id="btnReset">重置</button>
      </div>
      <div class="row hint">提示：在画布上拖动角点移动位置；在角点附近滚动滚轮微调其深度。</div>
    </div>
    <div class="panel">
      <h3>探针（鼠标悬停画布）</h3>
      <table class="probe" id="probeTable"></table>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
