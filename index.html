<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>自适应双三次 Bezier 曲面细分</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
    #app { position: fixed; inset: 0; }
    #panel {
      position: fixed; top: 12px; left: 12px; width: 300px;
      background: rgba(16, 20, 24, 0.88); color: #cfd8dc;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
      border: 1px solid #2a3540; border-radius: 8px; padding: 12px 14px;
      user-select: none;
    }
    #panel h1 { font-size: 13px; margin: 0 0 8px; color: #eceff1; }
    #panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    #panel input[type="range"] { flex: 1; }
    #stats { margin-top: 8px; white-space: pre; }
    .ok { color: #7ee787; }
    .bad { color: #ff7b72; }
    .hint { color: #8b98a5; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="panel">
    <h1>双三次 Bezier 曲面 · 屏幕空间自适应细分</h1>
    <label>像素容差 <input id="tol" type="range" min="0.2" max="4" step="0.05" value="0.9" />
      <span id="tolVal">0.90</span>px</label>
    <label><input id="wire" type="checkbox" checked /> 线框（三角形）</label>
    <label><input id="ctrl" type="checkbox" checked /> 控制网格 / 控制点</label>
    <label><input id="spin" type="checkbox" /> 自动旋转</label>
    <div id="stats"></div>
    <div class="hint">拖动空白处旋转 · 滚轮缩放 · 拖动彩色小球移动控制点（局部重建）</div>
  </div>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
